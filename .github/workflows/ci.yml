# 手元と同じ入口: supabase start → supabase test db
# Node の lint / 画面 E2E は後のフェーズ。
name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start Supabase
        run: supabase start

      - name: Run database tests
        run: supabase test db

      - name: Stop Supabase
        if: always()
        run: supabase stop
